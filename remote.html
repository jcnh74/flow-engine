<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flow Engine Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      overflow-x: hidden;
      touch-action: pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    body.is-dragging { overflow: hidden; touch-action: none; }
    .remote-header {
      padding: 16px 20px;
      background: #151520;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .remote-title { font-size: 16px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }
    .status-indicator { width: 12px; height: 12px; border-radius: 50%; background: #ff3366; }
    .status-indicator.connected { background: #00ff88; }
    .remote-body { padding: 16px 20px 48px; }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #8888a0; margin-bottom: 12px;
    }
    .mode-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .mode-btn {
      min-height: 52px; padding: 12px; background: #1a1a2e; border: 2px solid #2a2a3e;
      border-radius: 10px; color: #e0e0e8; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .mode-btn:active { transform: scale(0.97); background: #6b5fff; border-color: #6b5fff; }
    .mode-btn.active { background: #6b5fff; border-color: #8b7fff; }
    .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .preset-btn {
      min-height: 56px; padding: 12px; background: #1a1a2e; border: 2px solid #2a2a3e;
      border-radius: 10px; color: #e0e0e8; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer;
    }
    .preset-mode { font-size: 10px; color: #8888a0; margin-top: 4px; text-transform: uppercase; }
    .ctl {
      margin-bottom: 14px; background: #14141c; border: 1px solid #2a2a3e;
      border-radius: 12px; padding: 12px 14px;
    }
    .ctl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .ctl-label { font-size: 14px; font-weight: 600; }
    .ctl-value { color: #c4b4ff; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ctl-remove {
      min-width: 44px; min-height: 36px; border: 0; background: transparent;
      color: #8888a0; font-size: 18px; cursor: pointer;
    }
    .touch-slider {
      position: relative; width: 100%; height: 44px;
      touch-action: none; cursor: grab; overscroll-behavior: contain;
    }
    .touch-slider.is-dragging { cursor: grabbing; }
    .touch-slider-track, .touch-slider-fill {
      position: absolute; left: 0; top: 50%; height: 12px; margin-top: -6px;
      border-radius: 6px; pointer-events: none;
    }
    .touch-slider-track { right: 0; background: #2a2a3e; }
    .touch-slider-fill { background: #6b5fff; }
    .touch-slider-thumb {
      position: absolute; top: 50%; width: 28px; height: 28px;
      margin: -14px 0 0 -14px; border-radius: 50%;
      background: #6b5fff; border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(107, 95, 255, 0.5);
      pointer-events: none; z-index: 1;
    }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button, .toggle {
      min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px;
      border: 2px solid #2a2a3e; background: #1a1a2e; color: #e0e0e8; font-size: 13px; cursor: pointer;
    }
    .seg button.on, .toggle.on { background: #6b5fff; border-color: #8b7fff; }
    input[type="color"] {
      -webkit-appearance: none; width: 56px; height: 44px; border: 0; border-radius: 10px;
      background: transparent; padding: 0; cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
    .color-row { display: flex; align-items: center; gap: 12px; }
    .swatch-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .swatch-preset {
      min-height: 36px; padding: 0 12px; border-radius: 16px;
      border: 1px solid #2a2a3e; background: #1a1a2e; color: #e0e0e8;
      font-size: 12px; cursor: pointer;
    }
    .swatch-preset:active { background: #6b5fff; }
    .add-btn, .edit-done {
      width: 100%; min-height: 48px; border-radius: 12px; border: 2px dashed #3a3a50;
      background: transparent; color: #c4b4ff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .picker { margin-top: 10px; }
    .picker-sec { margin-bottom: 12px; }
    .picker-sec h4 { font-size: 11px; color: #8888a0; text-transform: uppercase; margin-bottom: 6px; }
    .picker-item {
      display: flex; justify-content: space-between; align-items: center;
      min-height: 44px; padding: 0 10px; border-radius: 8px; background: #1a1a2e;
      margin-bottom: 6px; border: 1px solid #2a2a3e;
    }
    .picker-item button {
      min-height: 36px; min-width: 64px; border-radius: 8px; border: 0;
      background: #6b5fff; color: #fff; font-weight: 600; cursor: pointer;
    }
    .picker-item button.on { background: #2a2a3e; color: #8888a0; }
    .move { display: flex; gap: 4px; }
    .move button {
      min-width: 36px; min-height: 36px; border: 0; background: #1a1a2e;
      color: #e0e0e8; border-radius: 8px; cursor: pointer;
    }
    .group {
      margin-bottom: 12px; background: #101018; border: 1px solid #2a2a3e; border-radius: 14px; overflow: hidden;
    }
    .group-head {
      min-height: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: #c8c8d8;
    }
    .group-head .chev { color: #8888a0; font-size: 12px; }
    .group.collapsed .group-body { display: none; }
    .group-body { padding: 4px 12px 12px; }
    .fav-empty { color: #8888a0; font-size: 13px; padding: 8px 0 12px; }
    .display-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .display-toggles button {
      min-height: 52px; min-width: 44px; padding: 8px 10px;
      background: #1a1a2e; border: 2px solid #2a2a3e; border-radius: 10px;
      color: #e0e0e8; font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .display-toggles button .sub { font-size: 11px; font-weight: 500; color: #8888a0; letter-spacing: 0; text-transform: none; }
    .display-toggles button.on { background: #6b5fff; border-color: #8b7fff; }
    .display-toggles button.on .sub { color: #ddd6ff; }
  </style>
</head>
<body>
  <div class="remote-header">
    <div class="remote-title">Flow Engine</div>
    <div class="status-indicator" id="status"></div>
  </div>
  <div class="remote-body">
    <div class="section">
      <div class="section-title">Display</div>
      <div class="display-toggles">
        <button type="button" id="btn-hide-ui" aria-pressed="false">Hide UI<span class="sub" id="hide-ui-sub">Panel visible</span></button>
        <button type="button" id="btn-performance" aria-pressed="false">Performance / Fullscreen<span class="sub" id="perf-sub">Off</span></button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Mode</div>
      <div class="mode-buttons" id="modes"></div>
    </div>
    <div class="section">
      <div class="section-title">Favorites</div>
      <div id="deck"></div>
      <p class="fav-empty" id="fav-empty" hidden>No favorites yet. Everything is still editable in the groups below.</p>
      <button class="add-btn" id="edit-btn">Arrange favorites</button>
      <div class="picker" id="picker" hidden></div>
    </div>
    <div class="section">
      <div class="section-title">All controls</div>
      <div id="groups"></div>
    </div>
    <div class="section">
      <div class="section-title">Presets</div>
      <div class="preset-grid" id="presets"></div>
    </div>
  </div>
  <script>
    const MODES = ['Paint', 'Paint Pour', 'City Vortex', 'Jungle', 'Stargate', 'Fabric', '3D Fractal', 'Bead Knot', 'Mirror Mandala', 'Feather Vortex', 'Crystal Temple'];

    let ws, state = { mode: 'Jungle', schema: [], layout: [], presets: [], paused: false };
    let editing = false;
    const values = {};
    const dragging = new Set();
    const collapsed = new Set();
    const LS = 'flow-remote-layout-v1';
    let pendingSend = null, sendRaf = 0;

    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
    function stepValue(v, min, max, step) {
      const s = step > 0 ? step : 0.01;
      const snapped = Math.round((v - min) / s) * s + min;
      const decimals = (String(s).split('.')[1] || '').length;
      return Number(clamp(snapped, min, max).toFixed(decimals));
    }
    function valueFromRelativeDrag(startValue, dx, dy, trackWidth, min, max, step) {
      const span = max - min;
      const width = Math.max(trackWidth, 1);
      const fine = 1 / (1 + Math.abs(dy) / 90);
      return stepValue(startValue + (dx / width) * span * fine, min, max, step);
    }
    function paintSlider(root, value) {
      const min = Number(root.dataset.min), max = Number(root.dataset.max);
      const r = clamp((value - min) / (max - min || 1), 0, 1);
      const fill = root.querySelector('.touch-slider-fill');
      const thumb = root.querySelector('.touch-slider-thumb');
      if (fill) fill.style.width = (r * 100) + '%';
      if (thumb) thumb.style.left = (r * 100) + '%';
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.hostname}:3001`);
      ws.onopen = () => {
        document.getElementById('status').classList.add('connected');
        ws.send(JSON.stringify({ type: 'register', role: 'remote' }));
        ws.send(JSON.stringify({ type: 'hello' }));
      };
      ws.onclose = () => {
        document.getElementById('status').classList.remove('connected');
        setTimeout(connect, 1500);
      };
      ws.onerror = () => {};
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'state') updateState(msg.data);
        } catch (e) {}
      };
    }
    function send(type, data) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, data }));
    }
    function queueParam(key, value) {
      values[key] = value;
      if (!pendingSend) pendingSend = {};
      pendingSend[key] = value;
      if (!sendRaf) {
        sendRaf = requestAnimationFrame(() => {
          sendRaf = 0;
          const payload = pendingSend; pendingSend = null;
          if (payload) send('param', payload);
        });
      }
    }
    function flushParams() {
      if (sendRaf) { cancelAnimationFrame(sendRaf); sendRaf = 0; }
      if (pendingSend) { send('param', pendingSend); pendingSend = null; }
    }
    function localLayout(mode) {
      try {
        const all = JSON.parse(localStorage.getItem(LS) || '{}');
        if (Array.isArray(all[mode]) && all[mode].length) return all[mode];
      } catch {}
      return null;
    }
    function persistLayout(mode, keys) {
      try {
        const all = JSON.parse(localStorage.getItem(LS) || '{}');
        all[mode] = keys;
        localStorage.setItem(LS, JSON.stringify(all));
      } catch {}
      send('layout', { mode, keys });
    }
    function ctlByKey(key) {
      for (const sec of state.schema || []) {
        const c = (sec.ctls || []).find((x) => x.key === key);
        if (c) return { ...c, section: sec.title };
      }
      return null;
    }
    function fmt(v, step) {
      if (typeof v === 'boolean') return v ? 'On' : 'Off';
      if (typeof v !== 'number') return String(v ?? '');
      return (step && step >= 1) ? String(Math.round(v)) : v.toFixed(2);
    }
    function optionPairs(c) {
      const o = c.options;
      if (!o) return [];
      if (Array.isArray(o)) return o.map((n) => [n, n]);
      return Object.keys(o).map((n) => [n, o[n]]);
    }

    function bindSlider(root, key, c, valueEl) {
      let drag = null;
      let lastTap = 0;
      const min = Number(c.min), max = Number(c.max), step = c.step ?? 0.01;
      const onDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        root.setPointerCapture(e.pointerId);
        const track = root.querySelector('.touch-slider-track');
        const width = (track || root).getBoundingClientRect().width;
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, v: values[key] ?? min, last: values[key] ?? min, width };
        dragging.add(key);
        root.classList.add('is-dragging');
        document.body.classList.add('is-dragging');
      };
      const onMove = (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        e.preventDefault();
        const v = valueFromRelativeDrag(drag.v, e.clientX - drag.x, e.clientY - drag.y, drag.width, min, max, step);
        drag.last = v;
        values[key] = v;
        paintSlider(root, v);
        if (valueEl) valueEl.textContent = fmt(v, step);
        document.querySelectorAll(`.ctl-value[data-k="${key}"]`).forEach((el) => { el.textContent = fmt(v, step); });
        document.querySelectorAll(`.touch-slider[data-param="${key}"]`).forEach((el) => { if (el !== root) paintSlider(el, v); });
        queueParam(key, v);
      };
      const onUp = (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const v = drag.last;
        const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
        drag = null;
        root.classList.remove('is-dragging');
        document.body.classList.remove('is-dragging');
        try { root.releasePointerCapture(e.pointerId); } catch {}
        if (moved <= 12) {
          const now = performance.now();
          if (now - lastTap < 380) {
            lastTap = 0;
            const def = root.dataset.default !== undefined ? parseFloat(root.dataset.default) : min;
            values[key] = def;
            paintSlider(root, def);
            if (valueEl) valueEl.textContent = fmt(def, step);
            document.querySelectorAll(`.ctl-value[data-k="${key}"]`).forEach((el) => { el.textContent = fmt(def, step); });
            document.querySelectorAll(`.touch-slider[data-param="${key}"]`).forEach((el) => paintSlider(el, def));
            flushParams();
            send('param', { [key]: def });
            dragging.delete(key);
            return;
          }
          lastTap = now;
        } else lastTap = 0;
        flushParams();
        dragging.delete(key);
      };
      root.addEventListener('pointerdown', onDown);
      root.addEventListener('pointermove', onMove);
      root.addEventListener('pointerup', onUp);
      root.addEventListener('pointercancel', onUp);
    }

    function renderControl(c, { removable, onRemove, moveButtons } = {}) {
      const wrap = document.createElement('div');
      wrap.className = 'ctl';
      wrap.dataset.key = c.key;
      const val = values[c.key] ?? state[c.key] ?? c.min ?? '';
      values[c.key] = val;
      const head = document.createElement('div');
      head.className = 'ctl-head';
      head.innerHTML = `<span class="ctl-label">${c.label}</span><span class="ctl-value" data-k="${c.key}">${fmt(val, c.step)}</span>`;
      if (moveButtons) head.appendChild(moveButtons);
      if (removable) {
        const rm = document.createElement('button');
        rm.className = 'ctl-remove';
        rm.textContent = '×';
        rm.onclick = onRemove;
        head.appendChild(rm);
      }
      wrap.appendChild(head);
      if (c.type === 'slider' || c.type === 'knob') {
        const min = Number(c.min), max = Number(c.max), step = c.step ?? 0.01;
        const r = clamp((Number(val) - min) / (max - min || 1), 0, 1);
        const sl = document.createElement('div');
        sl.className = 'touch-slider';
        sl.dataset.param = c.key;
        sl.dataset.min = String(min);
        sl.dataset.max = String(max);
        sl.dataset.step = String(step);
        sl.dataset.default = String(val);
        sl.setAttribute('role', 'slider');
        sl.innerHTML = `<div class="touch-slider-track"></div><div class="touch-slider-fill" style="width:${r * 100}%"></div><div class="touch-slider-thumb" style="left:${r * 100}%"></div>`;
        wrap.appendChild(sl);
        bindSlider(sl, c.key, c, head.querySelector('.ctl-value'));
      } else if (c.type === 'check') {
        const btn = document.createElement('button');
        btn.className = 'toggle' + (val ? ' on' : '');
        btn.textContent = val ? 'On' : 'Off';
        btn.onclick = () => {
          const v = !values[c.key];
          values[c.key] = v; btn.className = 'toggle' + (v ? ' on' : ''); btn.textContent = v ? 'On' : 'Off';
          wrap.querySelector('.ctl-value').textContent = fmt(v);
          send('param', { [c.key]: v });
        };
        wrap.appendChild(btn);
      } else if (c.type === 'color') {
        const row = document.createElement('div');
        row.className = 'color-row';
        const inp = document.createElement('input');
        inp.type = 'color'; inp.value = (typeof val === 'string' && val.startsWith('#')) ? val : '#ffffff';
        inp.oninput = () => {
          values[c.key] = inp.value;
          wrap.querySelector('.ctl-value').textContent = inp.value;
          send('param', { [c.key]: inp.value });
        };
        row.appendChild(inp);
        wrap.appendChild(row);
      } else if (c.type === 'select') {
        const row = document.createElement('div');
        row.className = 'seg';
        optionPairs(c).forEach(([name, v]) => {
          const b = document.createElement('button');
          b.textContent = name;
          if (String(val) === String(v) || val == v) b.className = 'on';
          b.onclick = () => {
            values[c.key] = v;
            row.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
            wrap.querySelector('.ctl-value').textContent = name;
            send('param', { [c.key]: v });
          };
          row.appendChild(b);
        });
        wrap.appendChild(row);
      }
      return wrap;
    }

    function renderDeck() {
      const deck = document.getElementById('deck');
      const layout = state.layout || [];
      deck.innerHTML = '';
      document.getElementById('fav-empty').hidden = layout.length > 0;
      layout.forEach((key, i) => {
        const c = ctlByKey(key);
        if (!c) return;
        let move;
        if (editing) {
          move = document.createElement('div');
          move.className = 'move';
          move.innerHTML = `<button data-mv="-1">↑</button><button data-mv="1">↓</button>`;
          move.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => {
            const dir = Number(b.dataset.mv);
            const arr = state.layout.slice();
            const j = i + dir;
            if (j < 0 || j >= arr.length) return;
            const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            state.layout = arr; persistLayout(state.mode, arr); renderDeck();
          });
        }
        const wrap = renderControl(c, {
          removable: editing,
          moveButtons: move,
          onRemove: () => {
            state.layout = state.layout.filter((k) => k !== key);
            persistLayout(state.mode, state.layout); renderDeck(); renderPicker();
          }
        });
        deck.appendChild(wrap);
      });
    }

    function renderGroups() {
      const box = document.getElementById('groups');
      box.innerHTML = '';
      (state.schema || []).forEach((sec, idx) => {
        const g = document.createElement('div');
        const id = sec.title || ('sec-' + idx);
        g.className = 'group' + (collapsed.has(id) ? ' collapsed' : '');
        const head = document.createElement('div');
        head.className = 'group-head';
        const n = (sec.ctls || []).length;
        head.innerHTML = `<span>${sec.title}</span><span class="chev">${collapsed.has(id) ? '▸' : '▾'} ${n}</span>`;
        head.onclick = () => {
          if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
          g.classList.toggle('collapsed', collapsed.has(id));
          head.querySelector('.chev').textContent = (collapsed.has(id) ? '▸' : '▾') + ' ' + n;
        };
        const body = document.createElement('div');
        body.className = 'group-body';
        if (sec.palettes && Object.keys(sec.palettes).length) {
          const pals = document.createElement('div');
          pals.className = 'swatch-presets';
          Object.keys(sec.palettes).forEach((name) => {
            const b = document.createElement('button');
            b.className = 'swatch-preset';
            b.textContent = name;
            b.onclick = () => {
              const vals = sec.palettes[name];
              Object.assign(values, vals);
              send('param', vals);
              renderAll();
            };
            pals.appendChild(b);
          });
          body.appendChild(pals);
        }
        (sec.ctls || []).forEach((c) => body.appendChild(renderControl(c)));
        g.appendChild(head);
        g.appendChild(body);
        box.appendChild(g);
      });
    }

    function renderPresets() {
      const el = document.getElementById('presets');
      el.innerHTML = '';
      const list = (state.presets && state.presets.length)
        ? state.presets
        : [];
      list.forEach((preset) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        const label = preset.name || preset;
        btn.innerHTML = `${label}<div class="preset-mode">${preset.mode || state.mode}</div>`;
        btn.onclick = () => send('preset', { name: label });
        el.appendChild(btn);
      });
    }

    function renderPicker() {
      const box = document.getElementById('picker');
      if (!editing) { box.hidden = true; box.innerHTML = ''; return; }
      box.hidden = false;
      const assigned = new Set(state.layout || []);
      box.innerHTML = '';
      (state.schema || []).forEach((sec) => {
        const d = document.createElement('div');
        d.className = 'picker-sec';
        d.innerHTML = `<h4>${sec.title}</h4>`;
        (sec.ctls || []).forEach((c) => {
          const row = document.createElement('div');
          row.className = 'picker-item';
          const on = assigned.has(c.key);
          row.innerHTML = `<span>${c.label}</span><button class="${on ? 'on' : ''}" data-key="${c.key}">${on ? 'Remove' : 'Add'}</button>`;
          row.querySelector('button').onclick = () => {
            if (assigned.has(c.key)) state.layout = state.layout.filter((k) => k !== c.key);
            else state.layout = (state.layout || []).concat([c.key]);
            persistLayout(state.mode, state.layout);
            renderDeck(); renderPicker();
          };
          d.appendChild(row);
        });
        box.appendChild(d);
      });
    }

    function renderAll() {
      renderDeck();
      renderGroups();
      renderPresets();
      if (editing) renderPicker();
    }

    function updateState(s) {
      const modeChanged = s.mode && s.mode !== state.mode;
      const wasDragging = dragging.size > 0;
      // Apply incoming values except keys currently being dragged, so echoes cannot snap back.
      for (const [k, v] of Object.entries(s)) {
        if (k === 'schema' || k === 'layout' || k === 'presets') continue;
        if (dragging.has(k)) continue;
        values[k] = v;
      }
      if (s.schema) state.schema = s.schema;
      if (Array.isArray(s.presets)) state.presets = s.presets;
      if (s.mode) state.mode = s.mode;
      const local = localLayout(s.mode);
      if (local) state.layout = local;
      else if (Array.isArray(s.layout)) state.layout = s.layout;
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.textContent === state.mode);
      });
      syncDisplayToggles(s);
      if (wasDragging && !modeChanged) {
        // Live-update value readouts for keys we are not dragging, without rebuilding the tree.
        for (const [k, v] of Object.entries(values)) {
          if (dragging.has(k)) continue;
          document.querySelectorAll(`.ctl-value[data-k="${k}"]`).forEach((el) => {
            const c = ctlByKey(k);
            el.textContent = fmt(v, c && c.step);
          });
          if (typeof v === 'number') {
            document.querySelectorAll(`.touch-slider[data-param="${k}"]`).forEach((el) => paintSlider(el, v));
          }
        }
        return;
      }
      renderAll();
    }

    function syncDisplayToggles(s) {
      const hidden = !!(s && 'uiHidden' in s ? s.uiHidden : values.uiHidden);
      const perf = !!(s && 'performanceMode' in s ? s.performanceMode : values.performanceMode);
      const pending = !!(s && 'fullscreenPending' in s ? s.fullscreenPending : values.fullscreenPending);
      const fs = !!(s && 'fullscreen' in s ? s.fullscreen : values.fullscreen);
      const hideBtn = document.getElementById('btn-hide-ui');
      const perfBtn = document.getElementById('btn-performance');
      const hideSub = document.getElementById('hide-ui-sub');
      const perfSub = document.getElementById('perf-sub');
      if (hideBtn) {
        hideBtn.classList.toggle('on', hidden);
        hideBtn.setAttribute('aria-pressed', hidden ? 'true' : 'false');
      }
      if (hideSub) hideSub.textContent = hidden ? 'Panel hidden' : 'Panel visible';
      if (perfBtn) {
        perfBtn.classList.toggle('on', perf);
        perfBtn.setAttribute('aria-pressed', perf ? 'true' : 'false');
      }
      if (perfSub) {
        if (!perf) perfSub.textContent = 'Off';
        else if (fs) perfSub.textContent = 'Fullscreen on';
        else if (pending) perfSub.textContent = 'Tap the display to go fullscreen';
        else perfSub.textContent = 'UI hidden';
      }
    }
    const modesEl = document.getElementById('modes');
    MODES.forEach((mode) => {
      const btn = document.createElement('button');
      btn.className = 'mode-btn';
      btn.textContent = mode;
      btn.onclick = () => send('param', { mode });
      modesEl.appendChild(btn);
    });
    document.getElementById('btn-hide-ui').onclick = () => {
      send('action', { action: values.uiHidden ? 'show-ui' : 'hide-ui' });
    };
    document.getElementById('btn-performance').onclick = () => {
      send('action', { action: values.performanceMode ? 'exit-performance' : 'enter-performance' });
    };
    document.getElementById('edit-btn').onclick = () => {
      editing = !editing;
      document.getElementById('edit-btn').textContent = editing ? 'Done' : 'Arrange favorites';
      renderDeck(); renderPicker();
    };
    connect();
  </script>
</body>
</html>
