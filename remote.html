<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flow Engine Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    
    .remote-header {
      padding: 20px;
      background: #151520;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .remote-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3366;
    }
    
    .status-indicator.connected {
      background: #00ff88;
    }
    
    .remote-body {
      padding: 20px;
    }
    
    .section {
      margin-bottom: 30px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8888a0;
      margin-bottom: 15px;
    }
    
    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .mode-btn {
      padding: 20px;
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e8;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mode-btn:active {
      transform: scale(0.95);
      background: #6b5fff;
      border-color: #6b5fff;
    }
    
    .mode-btn.active {
      background: #6b5fff;
      border-color: #8b7fff;
    }
    
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .preset-btn {
      padding: 16px;
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    
    .preset-btn:active {
      transform: scale(0.95);
      background: #6b5fff;
      border-color: #6b5fff;
    }
    
    .preset-mode {
      font-size: 10px;
      color: #8888a0;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    
    .action-btn {
      padding: 20px;
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e8;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .action-btn:active {
      transform: scale(0.95);
      background: #ff3366;
      border-color: #ff3366;
    }
    
    .blackout-btn {
      grid-column: span 3;
      background: #1a0000;
      border-color: #ff3366;
      color: #ff3366;
      font-size: 20px;
      font-weight: 700;
    }
    
    .blackout-btn:active {
      background: #ff3366;
      color: #fff;
    }
    
    .slider-section {
      margin-bottom: 20px;
    }
    
    .slider-label {
      font-size: 12px;
      color: #8888a0;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    
    .slider-value {
      color: #6b5fff;
      font-weight: 600;
    }
    
    input[type="range"] {
      width: 100%;
      height: 60px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-track {
      background: #2a2a3e;
      height: 8px;
      border-radius: 4px;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6b5fff;
      margin-top: -16px;
      box-shadow: 0 4px 12px rgba(107, 95, 255, 0.5);
    }
    
    input[type="range"]:active::-webkit-slider-thumb {
      background: #8b7fff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="remote-header">
    <div class="remote-title">Flow Engine</div>
    <div class="status-indicator" id="status"></div>
  </div>
  
  <div class="remote-body">
    <!-- Modes -->
    <div class="section">
      <div class="section-title">Mode</div>
      <div class="mode-buttons" id="modes"></div>
    </div>
    
    <!-- Presets -->
    <div class="section">
      <div class="section-title">
        Presets
        <span id="current-preset" style="color: #6b5fff; font-weight: 400; margin-left: 8px;"></span>
      </div>
      <div class="preset-grid" id="presets"></div>
    </div>
    
    <!-- Actions -->
    <div class="section">
      <div class="section-title">Actions</div>
      <div class="action-buttons">
        <button class="action-btn" data-action="prev">◀</button>
        <button class="action-btn" data-action="random">🎲</button>
        <button class="action-btn" data-action="next">▶</button>
        <button class="action-btn" data-action="tap">🥁 Tap</button>
        <button class="action-btn" data-action="pause">⏸</button>
        <button class="action-btn" data-action="reset">⛑</button>
        <button class="blackout-btn" data-action="blackout">BLACKOUT</button>
      </div>
    </div>
    
    <!-- Sliders -->
    <div class="section">
      <div class="section-title">Quick Controls</div>
      <div class="slider-section">
        <div class="slider-label">
          <span>Bloom</span>
          <span class="slider-value" id="bloom-value">0.35</span>
        </div>
        <input type="range" id="bloom" min="0" max="2" step="0.01" value="0.35">
      </div>
      <div class="slider-section">
        <div class="slider-label">
          <span>Exposure</span>
          <span class="slider-value" id="exposure-value">1.0</span>
        </div>
        <input type="range" id="exposure" min="0.4" max="4" step="0.01" value="1.0">
      </div>
      <div class="slider-section">
        <div class="slider-label">
          <span>Speed</span>
          <span class="slider-value" id="speed-value">1.0</span>
        </div>
        <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1.0">
      </div>
    </div>
  </div>
  
  <script type="module">
    const MODES = ['Paint', 'Paint Pour', 'City Vortex', 'Jungle', 'Stargate', 'Fabric', '3D Fractal'];
    const PRESETS = [
      { name: 'Paint · Carnival Burst', mode: 'Paint' },
      { name: 'Paint Pour · Pour Classic', mode: 'Paint Pour' },
      { name: 'City Vortex · Golden Hour', mode: 'City Vortex' },
      { name: 'Jungle · Rainforest Journey', mode: 'Jungle' },
      { name: 'Stargate · Kubrick 1968', mode: 'Stargate' },
      { name: 'Fabric · Silk Parade', mode: 'Fabric' },
      { name: '3D Fractal · Lilac Bulb', mode: '3D Fractal' },
      { name: 'Fractal · Lilac Bulb', mode: '3D Fractal' },
    ];
    
    // WebSocket connection
    const wsUrl = `ws://${location.hostname}:3001`;
    let ws = null;
    let reconnectTimer = null;
    
    function connect() {
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log('Connected to relay');
        document.getElementById('status').classList.add('connected');
        ws.send(JSON.stringify({ type: 'register', role: 'remote' }));
      };
      
      ws.onclose = () => {
        console.log('Disconnected from relay');
        document.getElementById('status').classList.remove('connected');
        reconnectTimer = setTimeout(connect, 2000);
      };
      
      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
      };
      
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'state') {
            updateState(msg.data);
          }
        } catch (e) {
          console.error('Failed to parse message:', e);
        }
      };
    }
    
    function send(type, data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, data }));
      }
    }
    
    function updateState(state) {
      // Update sliders
      const bloom = document.getElementById('bloom');
      const exposure = document.getElementById('exposure');
      const speed = document.getElementById('speed');
      
      if (state.bloom !== undefined) {
        bloom.value = state.bloom;
        document.getElementById('bloom-value').textContent = state.bloom.toFixed(2);
      }
      if (state.exposure !== undefined) {
        exposure.value = state.exposure;
        document.getElementById('exposure-value').textContent = state.exposure.toFixed(2);
      }
      if (state.speed !== undefined) {
        speed.value = state.speed;
        document.getElementById('speed-value').textContent = state.speed.toFixed(2);
      }
      
      // Update active mode
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === state.mode);
      });
      
      // Update current preset name
      const presetEl = document.getElementById('current-preset');
      if (state.milkDropPreset) {
        presetEl.textContent = `— ${state.milkDropPreset}`;
      } else {
        presetEl.textContent = '';
      }
    }
    
    // Build UI
    const modesEl = document.getElementById('modes');
    MODES.forEach(mode => {
      const btn = document.createElement('button');
      btn.className = 'mode-btn';
      btn.textContent = mode;
      btn.onclick = () => send('param', { mode });
      modesEl.appendChild(btn);
    });
    
    const presetsEl = document.getElementById('presets');
    PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn';
      btn.innerHTML = `${preset.name}<div class="preset-mode">${preset.mode}</div>`;
      btn.onclick = () => send('preset', { name: preset.name });
      presetsEl.appendChild(btn);
    });
    
    // Action buttons
    document.querySelectorAll('.action-btn, .blackout-btn').forEach(btn => {
      btn.onclick = () => {
        const action = btn.dataset.action;
        send('action', { action });
      };
    });
    
    // Sliders
    ['bloom', 'exposure', 'speed'].forEach(param => {
      const slider = document.getElementById(param);
      const valueEl = document.getElementById(`${param}-value`);
      
      slider.oninput = () => {
        const value = parseFloat(slider.value);
        valueEl.textContent = value.toFixed(2);
        send('param', { [param]: value });
      };
    });
    
    // Connect
    connect();
  </script>
</body>
</html>
